# CI for PY-168.
#
# Python 3.12.11 is end-of-life, but from 3.8 onward getting it is no longer
# an ordeal: python-build-standalone covers the version, so `uv python install`
# yields a working interpreter in seconds.
#
# The 3.6 and 3.7 families of this corpus cannot do that -- their CI pulls a
# tarball from the actions/python-versions manifest and then drops Ubuntu
# 20.04's libssl1.1 and libffi7 in beside libpython, because 22.04+ ship
# neither and those CPythons link both. Fifteen lines there, four here. That
# difference is itself a property of the family.
#
# A skipped tool exits 3, and that is expected: 13 of the 29 still cannot
# install on this interpreter, which is the measurement. `make tools`
# distinguishes an expected skip from a new one.
name: PY-168

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # PyDriller and dulwich need real history

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Provide CPython 3.12.11
        run: |
          set -euo pipefail
          uv python install 3.12.11
          uv python find 3.12 | tee /tmp/pybin
          "$(cat /tmp/pybin)" -V

      - name: Install
        run: |
          "$(cat /tmp/pybin)" -m venv .venv
          .venv/bin/python -m pip install --upgrade "pip==26.2.1"
          .venv/bin/python -m pip install -r requirements-runtime.txt -r requirements-dev.txt   # conda hosts are unreachable in CI

      - name: Install opengrep and Trivy
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          echo "$HOME/.opengrep/cli/latest" >> "$GITHUB_PATH"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Test
        run: .venv/bin/python -m pytest -q

      - name: Cross-file consistency audit
        run: .venv/bin/python tools/full_check.py

      - name: Verify tool wiring
        run: .venv/bin/python tools/tool_integration.py --verify

      - name: Verify White Box Python metrics (workbook v0.2)
        run: .venv/bin/python tools/verify_strategy_metrics.py

      - name: Run every wired tool
        run: PYTHON=.venv/bin/python .venv/bin/python tools/tool_integration.py --run

      - name: Write CICD results index
        if: always()
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          reports = Path("reports")
          files = []
          if reports.is_dir():
              for p in sorted(reports.rglob("*")):
                  if p.is_file():
                      files.append(
                          {"path": p.as_posix(), "bytes": p.stat().st_size}
                      )
          index = {
              "branch": "PY_V312_POETRY_CONDA_MICRO",
              "branch_id": "PY-168",
              "repository": "Nandhini-Testable/python-corpus-dupli",
              "report_count": len(files),
              "reports": files,
          }
          reports.mkdir(exist_ok=True)
          out = reports / "cicd_results_index.json"
          out.write_text(json.dumps(index, indent=2), encoding="utf-8")
          print("Wrote", out, "with", len(files), "report file(s)")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-PY-168
          path: reports/
